<html xmlns:th="http://thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout}">
<title>Lista de eventos</title>
<body class="d-flex flex-column h-100">
	<main class="flex-shrink-0">
	    <!-- Page Content-->
	    <section layout:fragment="body" class="py-5">
	        <div class="container px-5 my-5">
	            <div class="text-center mb-5">
	                <h1 class="fw-bolder">Paisagens perto de você</h1>
	                <p class="lead fw-normal text-muted mb-0">Paisagens na sua area!</p>
	            </div>
	            <div class="row gx-5">
	                <!-- The "th:each" is a loop from thymeleaf that'll iterate through the clubs object and will also feed the th:src -->
	                <div th:each="event :${events}" class="col-lg-6 mb-3">
	                    <div class="position-relative mb-5">
	                        <img class="img-fluid rounded-3 mb-3" th:src="${event.photoURL}" alt="..." />
	                    </div>
	                    <a class="btn btn-primary" th:href="@{/events/{eventId}(eventId=${event.id})}">Detalhes</a>
	                </div>
	            </div>
	        </div>
	    </section>
	</main>
</body>
</html>
