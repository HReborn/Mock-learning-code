<html xmlns:th="http://thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout}">
<head>
	<title>Registrar</title>
</head>
<body class="d-flex flex-column h-100">
	<main class="flex-shrink-0">
	    <!-- Page Content-->
	    <section layout:fragment="body" class="py-5">
	   		<div class="container">
	   			<div th:if="${param.registerFailed}" class="alert alert-success">
	        	    Invalid username and password!
	        	</div>
		        <form role="form" method="post" th:action="@{/register/save}" th:object="${user}">
				  <div class="form-row">
				    <div class="form-group col-md-6">
				      <label for="username">Username</label>
				      <input 
					      type="text" 
					      class="form-control"
					      id="username"
					      name="username"
					      th:field="*{username}" 
					      placeholder="username">
					      <p th:if="${#fields.hasErrors('username')}" class="text-danger" th:errors="*{username}"></p>
				    </div>
				    <div class="form-group col-md-6">
				      <label for="email">Email</label>
				      <input 
					      type="text" 
					      class="form-control" 
					      id="email" 
					      name="email"
					      th:field="*{email}"
					      placeholder="email">
					      <p th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></p>
				    </div>
				  </div>
				  <div class="form-group mb-3">
				    <label for="password">Password</label>
				    <input 
					    type="text" 
					    class="form-control"
					    id="password"
					    name="password"
						th:field="*{password}"
					    placeholder="password">
					    <p th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></p>
				  </div>
				  <button type="submit" class="btn btn-primary">Registrar</button>
				  <a type="button" th:href="@{/login}" class="btn btn-primary">Já tem uma conta? Entre aqui.</a>
				</form>
			</div>
	    </section>
	</main>
</body>
</html>
